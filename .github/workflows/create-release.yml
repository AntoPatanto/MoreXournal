name: Create Release

on:
  workflow_dispatch:
    # Manual dry-run build of release artifacts (does not publish a GitHub release)
  push:
    # Triggers a release draft whenever a new version tag is pushed
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  build-targets-json: '.github/available-build-targets.json'
  build-type: 'RelWithDebInfo'

jobs:
  prepare:
    if: github.repository == 'AntoPatanto/MoreXournal'
    runs-on: ubuntu-latest
    name: 'Prepare jobs'
    outputs:
      linux_builds: ${{ steps.parse.outputs.linux_builds }}
      artifact_version_suffix: ${{ steps.parse.outputs.artifact_version_suffix }}
      version: ${{ steps.parse.outputs.version }}
      should_run: ${{ steps.parse.outputs.should_run }}
      should_publish: ${{ steps.parse.outputs.should_publish }}
      build_type: ${{ env.build-type }}
      release_name: ${{ steps.parse.outputs.release-name }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            ${{ env.build-targets-json }}
            CMakeLists.txt
          sparse-checkout-cone-mode: false
      - name: 'Parse targets list and setup version string'
        id: parse
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const available_targets = require('${{ env.build-targets-json }}')

            // Ship only the Linux x86_64 AppImage target (built on Ubuntu 22.04) plus
            // the source tarball and Fedora RPM. Windows, macOS and deb targets are parked.
            const appimageTarget = available_targets.linux_targets['ubuntu-22']
            if (!appimageTarget) {
              core.setFailed('Missing ubuntu-22 target in ${{ env.build-targets-json }}')
              return
            }
            core.setOutput('linux_builds', JSON.stringify([appimageTarget]))

            if ("${{ github.event_name }}" === 'push' && "${{ github.ref_type }}" === 'tag') {
              const tag = "${{ github.ref_name }}"
              const version = tag.substring(1) // Remove leading 'v'
              const release_name = "MoreXournal " + version
              core.setOutput('tag', tag)
              core.setOutput('version', version)
              core.setOutput('artifact_version_suffix', '')
              core.setOutput('should_run', 'true')
              core.setOutput('should_publish', 'true')
              core.setOutput('release-name', release_name)
              console.log("Building artifacts for release " + release_name)
            } else if ("${{ github.event_name }}" === 'workflow_dispatch') {
              const cmake = fs.readFileSync('CMakeLists.txt', 'utf8')
              const match = cmake.match(/^\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)/m)
              if (!match) {
                core.setFailed('Could not parse project VERSION from CMakeLists.txt')
                return
              }
              const version = match[1]
              const now = new Date()
              const suffix = "-snapshot-" + now.toISOString().slice(0, 10).replace(/-/g, "")
              core.setOutput('version', version)
              core.setOutput('artifact_version_suffix', suffix)
              core.setOutput('should_run', 'true')
              core.setOutput('should_publish', 'false')
              core.setOutput('release-name', "MoreXournal " + version + suffix)
              console.log("Running manual build of MoreXournal " + version + suffix + " (dry run, no release published)")
            } else {
              core.setFailed('Run does not match triggering parameters')
            }

  source-tarball:
    name: Create source tarball
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Create source tarball'
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SUFFIX="${{ needs.prepare.outputs.artifact_version_suffix }}"
          TARBALL="morexournal-${VERSION}${SUFFIX}.tar.gz"
          git archive --format=tar.gz --prefix="morexournal-${VERSION}/" -o "${TARBALL}" HEAD
          ls -lh "${TARBALL}"
      - name: 'Upload source tarball'
        uses: actions/upload-artifact@v6
        with:
          name: "MoreXournal source tarball"
          compression-level: 0
          path: "morexournal-${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.artifact_version_suffix }}.tar.gz"
          if-no-files-found: error

  run-ci:
    name: Create installers
    needs: prepare
    if: ${{ needs.prepare.outputs.should_run == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/create-installers.yml
    with:
      linux_builds: ${{ needs.prepare.outputs.linux_builds }}
      build_rpm: true
      artifact_version_suffix: ${{ needs.prepare.outputs.artifact_version_suffix }}
      build_type: ${{ needs.prepare.outputs.build_type }}

  publish-result:
    name: Publish
    needs: [source-tarball, run-ci, prepare]
    if: ${{ needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
          path: ${{ github.workspace }}/artifacts
      - name: 'List release artifacts'
        run: |
          for D in *; do [ -d "${D}" ] && zip -r "${D}.zip" "${D}" > /dev/null && rm -rf "${D}" && echo "Zipped ${D}"; done
          ls -lh
        working-directory: ${{ github.workspace }}/artifacts
      - name: 'Pull changelog'
        uses: actions/checkout@v6
        with:
          sparse-checkout: 'CHANGELOG.md'
          sparse-checkout-cone-mode: false
          path: ${{ github.workspace }}/changelog
      - name: 'Prepare release body'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          NOTES="$(awk -v ver="${RELEASE_VERSION}" '
            BEGIN { prefix = "## " ver }
            index($0, prefix) == 1 && (length($0) == length(prefix) || substr($0, length(prefix) + 1, 1) == " ") {
              found = 1
              next
            }
            found && /^## / { exit }
            found { print }
          ' changelog/CHANGELOG.md)"
          {
            echo 'body<<EOF'
            if [ -n "${NOTES}" ]; then
              printf '%s\n\n' "${NOTES}"
            else
              echo "MoreXournal ${RELEASE_VERSION} release."
              echo ""
            fi
            echo "See https://github.com/AntoPatanto/MoreXournal/blob/${RELEASE_TAG}/CHANGELOG.md for the full changelog."
            echo 'EOF'
          } >> "$GITHUB_ENV"
      - uses: ncipollo/release-action@v1
        with:
          artifacts: "${{ github.workspace }}/artifacts/*"
          prerelease: false
          allowUpdates: true
          draft: true
          omitDraftDuringUpdate: true
          generateReleaseNotes: false
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ env.body }}
          removeArtifacts: true
          replacesArtifacts: true
          updateOnlyUnreleased: true
          artifactErrorsFailBuild: true
          tag: ${{ needs.prepare.outputs.tag }}
