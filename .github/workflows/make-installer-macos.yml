# Template for running MacOS release jobs

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      displayed_name:
        type: string
        required: true
      head_sha:         # SHA of the commit to build. Defaults to the head of the triggering event (cf github doc.)
        type: string
        default: ''
      build_type:
        type: string
        default: 'RelWithDebInfo'
      extra_cmake_flags:
        type: string
        default: ''
      artifact_version_suffix:  # Additional version string appended to 1.2.3+dev (for instance) in artifacts names
        type: string
        default: ''
    outputs:
      link:
        description: URL of the produced installer
        value: ${{ jobs.release-macos.outputs.link }}

jobs:
  release-macos:
    name: Create installer for ${{ inputs.displayed_name }}
    runs-on: ${{ inputs.runner }}
    outputs:
      link: ${{ steps.publish.outputs.artifact-url }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha }}
      - name: 'Install dependencies'
        uses: ./.github/actions/install_deps_mac
        with:
          install_path: $HOME
      - name: 'Build MoreXournal'
        uses: ./.github/actions/build
        with:
          build_type: ${{ inputs.build_type }}
          cmake_flags: >-
            -DCMAKE_INSTALL_PREFIX="$HOME/gtk/inst"
          extra_cmake_flags: ${{ inputs.extra_cmake_flags }}
      - name: 'Install rsvg-convert for the app icon'
        # The cached GTK blob does not ship rsvg-convert, which create-icns.sh needs
        shell: bash
        run: brew install librsvg
      - name: 'Create installer'
        id: create-installer
        shell: bash
        run: |
          set -euo pipefail
          which pkg-config
          pkg-config --version
          (cd build && cmake --build . --target install)
          (cd mac-setup && ./build-app.sh "$HOME/gtk")  # populates mac-setup/MoreXournal.app

          VERSION=$(sed -n '1p' build/VERSION)
          ARCH=$(uname -m)
          OUTPUT="morexournal-${VERSION}${{ inputs.artifact_version_suffix }}-macOS-${ARCH}.dmg"

          (cd mac-setup && ./build-dmg.sh MoreXournal.app "$OUTPUT")  # makes an installer out of this folder

          echo "artifact=$OUTPUT" >> "$GITHUB_OUTPUT"
      - name: 'Publish package'
        id: publish
        uses: actions/upload-artifact@v6
        with:
          name: "MoreXournal macOS package ${{ runner.arch }}"
          compression-level: 0
          path: "${{ github.workspace }}/mac-setup/${{ steps.create-installer.outputs.artifact }}"
          if-no-files-found: error
