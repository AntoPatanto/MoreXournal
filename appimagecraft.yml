version: 1

project:
  name: io.github.antopatanto.morexournal
  version_command: git describe --tags

scripts:
  pre_build:
    - mkdir translations-build
    - cd translations-build
    - cmake "${PROJECT_ROOT}"
    - make translations
    - cd ..

build:
  cmake:

appimage:
  linuxdeploy:
  raw_environment:
    - UPD_INFO="gh-releases-zsync|AntoPatanto|MoreXournal|latest|morexournal-*$ARCH.AppImage.zsync"
